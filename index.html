  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ne-height: 22px;\">\n          <p style=\"font-weight: 700; margin: 0 0 16px;\">Version 2.1, effective as of March 31, 2021<\u002Fp>\n          <p style=\"margin: 0 0 16px;\">This is a legal agreement, and it is important that you read it carefully.<\u002Fp>\n          <p style=\"margin: 0 0 16px;\">You understand that by accepting this agreement (\"Agreement\") (you do that by clicking the 'I agree' or similar button, or by accessing or using JetBrains team products or support), you are entering into a legal agreement and agree to certain legal consequences for yourself or your organization.<\u002Fp>\n          <p style=\"margin: 0 0 24px;\">If you do not agree to the terms and conditions of this agreement, you should not use the Product.<\u002Fp>\n          <h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 12px;\">1. Parties<\u002Fh3>\n          <p style=\"margin: 0 0 16px;\">(a) \"JetBrains\" or \"we\" means JetBrains s.r.o. whose registered office is at <b>Na hřebenech II 1718/10, Prague, 140 00, Czech Republic<\u002Fb>, registered with the Commercial Register kept by the Municipal Court of Prague, Section C, File 86211, ID No.: 265 02 275.<\u002Fp>\n          <p style=\"margin: 0 0 24px;\">(b) \"User\" or \"you\" means the individual given the right to use the Product in accordance with this Agreement. A User is a natural person and not a corporation, company, partnership or association, or other entity or organization<\u002Fp>\n          <h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 12px;\">2. Definitions<\u002Fh3>\n          <p style=\"margin: 0 0 16px;\">\"Hosting System\" means any domain, server, real or virtual network, internet connection, infrastructure, hardware, and applications used to host the Product or enabling you to host aspects of the Product. \"JetBrains Website\" means any website operated by JetBrains, including <a href=\"#\" style=\"color: var(--ring-link-color);\">www.jetbrains.com<\u002Fa> and <a href=\"#\" style=\"color: var(--ring-link-color);\">confluence.jetbrains.com<\u002Fa>. \"Privacy Policy\" means the JetBrains Privacy Policy available at https://www.jetbrains.com/legal/docs/privacy/privacy.html, which may be updated from time to time.<\u002Fp>\n          <p style=\"margin: 0 0 16px;\">\"Product\" means any JetBrains software with 'team' functionality provided via a Hosting System and is made available to the general public and Users through the JetBrains Website, or is designated as such in this Agreement or on the JetBrains Website. As of the effective date of this Agreement, Product includes: Code With Me, Datalore, Space, TeamCity, and YouTrack.<\u002Fp>\n          <p style=\"margin: 0 0 16px;\">\"Third-Party Software\" means any third-party software programs that are owned and licensed pursuant to Section 8 of this Agreement by parties other than JetBrains and that are either integrated with or made part of the Product.<\u002Fp>\n          <p style=\"margin: 0;\">\"User's Data\" means all electronic data or information submitted by the User via the Product or generated as a result of the User using the Product, and which may, depending on the Product, be stored, used, or transmitted by JetBrains on a Hosting System.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 32px; border-top: 1px solid rgb(223,225,229); flex-shrink: 0;\">\n          <div>\n            <p style=\"margin: 0 0 8px; font-size: 13px; line-height: 18px; color: rgb(108,112,126);\">Accept the JetBrains Team Tools User Agreement before you can continue to use TeamCity Cloud. Review the terms and click 'I agree' when you're ready to proceed.<\u002Fp>\n            <p style=\"margin: 0; font-size: 13px; color: rgb(39,40,46);\">Tanya Konvaliuk, tatiana.konvaliuk@jetbrains.com<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; flex-shrink: 0;\">\n            <button onclick=\"{{ ac items: center; gap: 6px; padding: 6px 8px; border-radius: 4px; background: rgb(237,243,255); color: rgb(39,40,46); font-size: 13px; font-weight: 500;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(51,105,214)\" stroke-width=\"1.6\"><path d=\"M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z\"><\u002Fpath><\u002Fsvg>\n              {{ projectName }}\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Content -->\n        <div style=\"flex-grow: 1; display: flex; flex-direction: column; min-width: 0;\">\n          <div style=\"height: 40px; flex-shrink: 0; border-bottom: 1px solid rgb(223,225,229); display: flex; align-items: center; gap: 6px; padding: 0 24px; color: rgb(39,40,46); font-size: 13px;\">\n            <span style=\"font-weight: 500;\">{{ projectName }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"padding: 24px; display: flex; align-items: center; gap: 10px;\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(108,112,126)\" stroke-width=\"1.6\"><path d=\"M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size: 24px; font-weight: 700; color: rgb(39,40,46);\">{{ projectName }}<\u002Fspan>\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(108,112,126)\" stroke-width=\"1.6\"><path d=\"M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8-5.2-4.6 6.9-.7Z\"><\u002Fpath><\u002Fsvg>\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(108,112,126)\" stroke-width=\"1.6\"><path d=\"M4 4v13a3 3 0 0 0 3 3h1\"><\u002Fpath><path d=\"M4 8h11l4-3v13l-4-3H4\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n\n          <div style=\"flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding-bottom: 80px;\">\n            <img src=\"0e88a519-9d4a-4763-aeda-d8f64a4f609a\" alt=\"\" style=\"width: 220px; height: 157px;\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 12px; width: 625px;\">\n              <span style=\"font-size: 20px; font-weight: 590; text-align: center; line-height: 24px; letter-spacing: 0.3px; color: rgb(39,40,46);\">No pipelines, build configurations, or subprojects<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 20px; text-align: center; color: rgb(108,112,126); white-space: nowrap;\">Create a pipeline or a build configuration to start building, testing, and deploying your solution.<\u002Fspan>\n              <div style=\"position: relative; display: flex; margin-top: 4px;\">\n                <button onclick=\"{{ goToBuildSetup }}\" style=\"width: 170px; height: 28px; border-radius: 4px 0 0 4px; background: rgb(51,105,214); border: none; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;\">Create new pipeline<\u002Fbutton>\n                <button onclick=\"{{ toggleCreateDropdown }}\" style=\"width: 27px; height: 28px; border-radius: 0 4px 4px 0; background: rgb(51,105,214); border: none; box-shadow: inset 1px 0 0 rgba(255,255,255,0.3); box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center;\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                <sc-if value=\"{{ createDropdownOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div onclick=\"{{ closeCreateDropdown }}\" style=\"position: fixed; inset: 0; z-index: 9;\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: 0; top: 32px; width: 217px; border-radius: 8px; background: #fff; box-shadow: inset 0 0 0 1px rgb(223,225,229), 0px 2px 8px 0px rgba(0,28,54,0.1), 0px 1px 2px 0px rgba(0,28,54,0.04); display: flex; flex-direction: column; padding: 6px 0; z-index: 10;\">\n                    <div onclick=\"{{ goToBuildConfig }}\" style=\"display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 14px; color: rgb(39,40,46); cursor: pointer;\" style-hover=\"background: var(--ring-hover-background-color);\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(108,112,126)\" stroke-width=\"1.5\"><path d=\"M12 4 20 12 12 20 4 12Z\"><\u002Fpath><\u002Fsvg>New build configuration<\u002Fdiv>\n                    <div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 14px; color: rgb(39,40,46); cursor: pointer;\" style-hover=\"background: var(--ring-hover-background-color);\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"rgb(108,112,126)\" stroke-width=\"1.5\"><path d=\"M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z\"><\u002Fpath><\u002Fsvg>New subproject<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- Footer -->\n  \n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    view: 'download',\n    domain: '',\n    domainError: '',\n    submitted: false,\n    agreePrivacy: true,\n    agreeNews: false,\n    role: '',\n    situation: '',\n    tools: [],\n    showOtherInput: false,\n    otherText: '',\n    otherToolText: '',\n    showThanksToast: false,\n    cloudExpanded: false,\n    cloudEmail: '',\n    repoDropdownOpen: true,\n    repoSelection: 'sample',\n    noRepoPipelineName: '',\n    activePipelineName: 'Pipeline demo',\n  };\n\n  toggleRepoDropdown = () => this.setState(s => ({ repoDropdownOpen: !s.repoDropdownOpen }));\n  closeRepoDropdown = () => this.setState({ repoDropdownOpen: false });\n  selectNoRepo = () => this.setState({ repoSelection: 'none', repoDropdownOpen: false });\n  selectSamplePipeline = () => this.setState({ repoSelection: 'sample', repoDropdownOpen: false });\n  goToPipelineRun = () => this.setState(s => ({\n    view: 'pipelineSuccessRun',\n    activePipelineName: s.repoSelection === 'none' ? (s.noRepoPipelineName.trim() || 'Pipeline') : 'Pipeline demo',\n  }));\n  goToPipelineRunDemo = () => this.setState({ view: 'pipelineSuccessRun', activePipelineName: 'Pipeline demo', repoSelection: 'sample' });\n  goToSmartPipeline = () => this.setState({ view: 'smartPipeline' });\n  continueToSmartPipeline = () => this.setState(s => ({ view: 'smartPipeline', activePipelineName: (s.pipelineNameConfig || '').trim() || 'Pipeline' }));\n  onNoRepoPipelineNameChange = (e) => this.setState({ noRepoPipelineName: e.target.value });\n  PROVIDER_INFO = {\n    github: { icon: './assets/icon-github.svg', label: 'GitHub.com', url: 'https://github.com/johnsonuk/marketdata-api-js', name: 'Marketdata-api-js' },\n    gitlab: { icon: './assets/icon-gitlab.svg', label: 'GitLab.com', url: 'https://gitlab.com/johnsonuk/marketdata-api', name: 'Marketdata-api' },\n    bitbucket: { icon: './assets/icon-bitbucket.svg', label: 'Bitbucket.com', url: 'https://bitbucket.org/johnsonuk/marketdata-service', name: 'Marketdata-service' },\n    none: { icon: '', label: 'Without repository', url: '', name: '' },\n    demo: { icon: './assets/icon-teamcity.svg', label: 'Pipeline demo', url: 'https://github.com/jetbrains/teamcity-demo', name: 'Pipeline demo' },\n  };\n  selectProvider = (provider) => {\n    const info = this.PROVIDER_INFO[provider];\n    if (this.state.view === 'connectRepoConfig') {\n      this.setState({ connectProvider: provider, providerDropdownOpen: false });\n      return;\n    }\n    this.setState({\n      view: 'connectRepoConfig', repoDropdownOpen: false, connectProvider: provider,\n      pipelineNameConfig: info.name, triggerBranchesOn: true, triggerScope: 'All', triggerPRsOn: true,\n    });\n  };\n  selectProviderGithub = () => this.selectProvider('github');\n  selectProviderGitlab = () => this.selectProvider('gitlab');\n  selectProviderBitbucket = () => this.selectProvider('bitbucket');\n  selectProviderNone = () => this.setState({ connectProvider: 'none', providerDropdownOpen: false, pipelineNameConfig: '' });\n  selectProviderDemo = () => this.setState({ view: 'buildConfig', repoSelection: 'sample', providerDropdownOpen: false, repoDropdownOpen: false });\n  toggleProviderDropdown = () => this.setState(s => ({ providerDropdownOpen: !s.providerDropdownOpen }));\n  closeProviderDropdown = () => this.setState({ providerDropdownOpen: false });\n  goToDownloadNoRepo = () => this.setState({ view: 'download', repoSelection: 'none', repoDropdownOpen: false, providerDropdownOpen: false });\n  onPipelineNameConfigChange = (e) => this.setState({ pipelineNameConfig: e.target.value });\n  toggleTriggerBranches = () => this.setState(s => ({ triggerBranchesOn: !s.triggerBranchesOn }));\n  toggleTriggerPRs = () => this.setState(s => ({ triggerPRsOn: !s.triggerPRsOn }));\n  setTriggerScopeAll = () => this.setState({ triggerScope: 'All' });\n  setTriggerScopeDefault = () => this.setState({ triggerScope: 'Default branch' });\n  setTriggerScopeSpecific = () => this.setState({ triggerScope: 'Specific' });\n  goToProjectOverview = () => this.setState({ view: 'projectOverview', createDropdownOpen: false });\n  goToBuildConfig = () => this.setState({ view: 'buildConfig', createDropdownOpen: false });\n  goToBuildSetup = () => this.setState({ view: 'buildConfig', createDropdownOpen: false, repoSelection: 'sample', repoDropdownOpen: true });\n  toggleCreateDropdown = () => this.setState(s => ({ createDropdownOpen: !s.createDropdownOpen }));\n  closeCreateDropdown = () => this.setState({ createDropdownOpen: false });\n  onPipelineNameKeyDown = (e) => {\n    if (e.key === 'Enter' && e.target.value.trim()) this.goToPipelineRun();\n  };\n  goToProjectOverviewNoop = () => {};\n\n  goToTrial = () => this.setState({ view: 'trial', submitted: false });\n  toggleCloudExpanded = () => this.setState(s => ({ cloudExpanded: !s.cloudExpanded }));\n  onCloudEmailChange = (e) => this.setState({ cloudEmail: e.target.value });\n  goToDownload = () => this.setState({ view: 'download' });\n\n  onDomainChange = (e) => {\n    const v = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');\n    this.setState({ domain: v, domainError: '', submitted: false });\n  };\n\n  togglePrivacy = () => this.setState(s => ({ agreePrivacy: !s.agreePrivacy, domainError: '' }));\n  toggleNews = () => this.setState(s => ({ agreeNews: !s.agreeNews }));\n\n  submitTrial = () => {\n    if (!this.state.domain) {\n      this.setState({ domainError: 'Enter a subdomain for your instance.' });\n      return;\n    }\n    if (!this.state.agreePrivacy) {\n      this.setState({ domainError: 'You must agree to the Privacy Policy to continue.' });\n      return;\n    }\n    this.setState({ domainError: '', view: 'survey1' });\n  };\n\n  chooseRole = (role) => this.setState({ role, view: 'survey2' });\n  chooseSituation = (situation) => {\n    if (this.state.role === \"I don't know what CI/CD is\") {\n      this.completeSurvey();\n      return;\n    }\n    this.setState({ situation, view: 'survey3' });\n  };\n  revealOtherInput = () => this.setState({ showOtherInput: true });\n  onOtherTextChange = (e) => this.setState({ otherText: e.target.value });\n  submitOther = () => {\n    if (!this.state.otherText.trim()) return;\n    this.chooseSituation(this.state.otherText.trim());\n  };\n  onOtherToolTextChange = (e) => this.setState({ otherToolText: e.target.value });\n  DONT_KNOW_TOOL = \"Don't know what CI/CD is\";\n  toggleTool = (tool) => this.setState(s => {\n    if (s.tools.includes(tool)) {\n      return { tools: s.tools.filter(t => t !== tool) };\n    }\n    if (tool === this.DONT_KNOW_TOOL) {\n      return { tools: [tool] };\n    }\n    return { tools: [...s.tools.filter(t => t !== this.DONT_KNOW_TOOL), tool] };\n  });\n  onAgreementScroll = (e) => {\n    const el = e.target;\n    if (el.scrollHeight - el.scrollTop - el.clientHeight < 8) {\n      this.setState({ agreementScrolledToEnd: true });\n    }\n  };\n  acceptAgreement = () => {\n    if (!this.state.agreementScrolledToEnd) return;\n    this.setState({ view: 'buildConfig' });\n  };\n  backToSurvey1 = () => this.setState({ view: 'survey1', showOtherInput: false });\n  backToSurvey2 = () => this.setState({ view: 'survey2' });\n  completeSurvey = () => {\n    this.setState({ view: 'agreement', showThanksToast: true, agreementScrolledToEnd: false });\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => this.setState({ showThanksToast: false }), 4000);\n  };\n  dismissToast = () => {\n    clearTimeout(this._toastTimer);\n    this.setState({ showThanksToast: false });\n  };\n\n  TOOLS_COL1 = ['AWS CodePipeline / AWS CodeBuild', 'TeamCity', 'Bitbucket Pipelines', 'Jenkins', 'CircleCI', 'Other'];\n  TOOLS_COL2 = ['GitHub Actions', 'Azure Pipelines / Azure DevOps', 'GitLab CI', 'BuildKite', 'Bamboo', \"Don't know what CI/CD is\"];\n\n  buildToolItems(names) {\n    return names.map(name => ({\n      name,\n      checked: this.state.tools.includes(name),\n      bg: this.state.tools.includes(name) ? 'rgb(25,138,243)' : '#fff',\n      border: this.state.tools.includes(name) ? 'none' : 'inset 0 0 0 1px rgb(215,221,226)',\n      toggle: () => this.toggleTool(name),\n    }));\n  }\n\n  renderVals() {\n    return {\n      isDownloadView: this.state.view === 'download',\n      isTrialView: this.state.view === 'trial',\n      isSurvey1: this.state.view === 'survey1',\n      isSurvey2: this.state.view === 'survey2',\n      isSurvey3: this.state.view === 'survey3',\n      isCicdUnknown: this.state.role === \"I don't know what CI/CD is\",\n      wizardTotalSteps: this.state.role === \"I don't know what CI/CD is\" ? 2 : 3,\n      isAgreement: this.state.view === 'agreement',\n      agreementScrolledToEnd: this.state.agreementScrolledToEnd,\n      onAgreementScroll: this.onAgreementScroll,\n      acceptAgreement: this.acceptAgreement,\n      agreementButtonBg: this.state.agreementScrolledToEnd ? 'rgb(51,105,214)' : 'rgb(223,225,229)',\n      agreementButtonCursor: this.state.agreementScrolledToEnd ? 'pointer' : 'not-allowed',\n      isBuildConfig: this.state.view === 'buildConfig',\n      isPipelineSuccessRun: this.state.view === 'pipelineSuccessRun',\n      isSmartPipeline: this.state.view === 'smartPipeline',\n      isConnectRepoConfig: this.state.view === 'connectRepoConfig',\n      selectProviderGithub: this.selectProviderGithub,\n      selectProviderGitlab: this.selectProviderGitlab,\n      selectProviderBitbucket: this.selectProviderBitbucket,\n      connectProviderInfo: this.PROVIDER_INFO[this.state.connectProvider || 'github'],\n      isProviderGithub: (this.state.connectProvider || 'github') === 'github',\n      isProviderGitlab: this.state.connectProvider === 'gitlab',\n      isProviderBitbucket: this.state.connectProvider === 'bitbucket',\n      isProviderNone: this.state.connectProvider === 'none',\n      isProviderDemo: this.state.connectProvider === 'demo',\n      isProviderGithubGitlabOrBitbucket: ['github', 'gitlab', 'bitbucket'].includes(this.state.connectProvider || 'github'),\n      selectProviderNone: this.selectProviderNone,\n      selectProviderDemo: this.selectProviderDemo,\n      providerDropdownOpen: this.state.providerDropdownOpen,\n      toggleProviderDropdown: this.toggleProviderDropdown,\n      closeProviderDropdown: this.closeProviderDropdown,\n      goToDownloadNoRepo: this.goToDownloadNoRepo,\n      pipelineNameConfig: this.state.pipelineNameConfig,\n      onPipelineNameConfigChange: this.onPipelineNameConfigChange,\n      triggerBranchesOn: this.state.triggerBranchesOn,\n      toggleTriggerBranches: this.toggleTriggerBranches,\n      triggerPRsOn: this.state.triggerPRsOn,\n      toggleTriggerPRs: this.toggleTriggerPRs,\n      triggerScope: this.state.triggerScope,\n      setTriggerScopeAll: this.setTriggerScopeAll,\n      setTriggerScopeDefault: this.setTriggerScopeDefault,\n      setTriggerScopeSpecific: this.setTriggerScopeSpecific,\n      scopeAllStyle: this.state.triggerScope === 'All' ? 'background: rgb(237,243,255); box-shadow: inset 0 0 0 1px rgb(51,105,214); border-radius: 4px;' : '',\n      scopeDefaultStyle: this.state.triggerScope === 'Default branch' ? 'background: rgb(237,243,255); box-shadow: inset 0 0 0 1px rgb(51,105,214); border-radius: 4px;' : '',\n      scopeSpecificStyle: this.state.triggerScope === 'Specific' ? 'background: rgb(237,243,255); box-shadow: inset 0 0 0 1px rgb(51,105,214); border-radius: 4px;' : '',\n      toggleTrackBg: (on) => on ? 'rgb(51,105,214)' : 'rgb(211,213,219)',\n      triggerBranchesTrackBg: this.state.triggerBranchesOn ? 'rgb(51,105,214)' : 'rgb(211,213,219)',\n      triggerBranchesKnobPos: this.state.triggerBranchesOn ? '18px' : '2px',\n      triggerPRsTrackBg: this.state.triggerPRsOn ? 'rgb(51,105,214)' : 'rgb(211,213,219)',\n      triggerPRsKnobPos: this.state.triggerPRsOn ? '18px' : '2px',\n      isProjectOverview: this.state.view === 'projectOverview',\n      goToProjectOverview: this.goToProjectOverview,\n      createDropdownOpen: this.state.createDropdownOpen,\n      toggleCreateDropdown: this.toggleCreateDropdown,\n      closeCreateDropdown: this.closeCreateDropdown,\n      goToBuildConfig: this.goToBuildConfig,\n      projectName: this.state.domain || 'Coherent Project',\n      activePipelineName: this.state.activePipelineName,\n      noRepoPipelineName: this.state.noRepoPipelineName,\n      onNoRepoPipelineNameChange: this.onNoRepoPipelineNameChange,\n      continueToSmartPipeline: this.continueToSmartPipeline,\n      goToPipelineRun: this.goToPipelineRun,\n      goToPipelineRunDemo: this.goToPipelineRunDemo,\n      goToSmartPipeline: this.goToSmartPipeline,\n      onPipelineNameKeyDown: this.onPipelineNameKeyDown,\n      repoDropdownOpen: this.state.repoDropdownOpen,\n      toggleRepoDropdown: this.toggleRepoDropdown,\n      closeRepoDropdown: this.closeRepoDropdown,\n      repoFieldBorderColor: this.state.repoDropdownOpen ? 'rgb(51,105,214)' : 'rgb(211,213,219)',\n      selectNoRepo: this.selectNoRepo,\n      selectSamplePipeline: this.selectSamplePipeline,\n      isNoRepoSelected: this.state.repoSelection === 'none',\n      repoFieldLabel: this.state.repoSelection === 'none' ? 'Without repository' : 'Pipeline demo',\n      primaryButtonLabel: this.state.repoSelection === 'none' ? 'Continue' : 'Run demo',\n      goToTrial: this.goToTrial,\n      goToBuildSetup: this.goToBuildSetup,\n      toggleCloudExpanded: this.toggleCloudExpanded,\n      cloudExpanded: this.state.cloudExpanded,\n      cloudChevronTransform: this.state.cloudExpanded ? 'rotate(180deg)' : 'rotate(0deg)',\n      cloudEmail: this.state.cloudEmail,\n      onCloudEmailChange: this.onCloudEmailChange,\n      cloudEmailEmpty: !this.state.cloudEmail.trim(),\n      cloudEmailButtonColor: this.state.cloudEmail.trim() ? 'var(--ring-text-color)' : 'var(--ring-disabled-color)',\n      cloudEmailButtonCursor: this.state.cloudEmail.trim() ? 'pointer' : 'not-allowed',\n      goToDownload: this.goToDownload,\n      chooseRoleSetup: () => this.chooseRole('I set up CI/CD myself'),\n      chooseRoleShared: () => this.chooseRole('I use CI/CD, someone else sets it up'),\n      chooseRoleChoose: () => this.chooseRole(\"I choose CI/CD tools, but don't configure them\"),\n      chooseRoleLearning: () => this.chooseRole('I\\u2019m learning CI/CD: no hands-on experience yet'),\n      chooseRoleUnknown: () => this.chooseRole(\"I don't know what CI/CD is\"),\n      chooseSituationCurious: () => this.chooseSituation('Just curious, nothing I need it for yet'),\n      chooseSituationExploring: () => this.chooseSit
